<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Fleger | Login</title>
    
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/jpeg" href="/auge-logo.jpg">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="text-slate-900 font-sans antialiased flex flex-col min-h-screen relative overflow-x-hidden">

    {% include navigation.html %}

    <main class="flex-grow flex items-center justify-center px-5 py-16 md:py-24 relative overflow-x-clip">
        <!-- leuchtende Farbflächen hinter der Glaskarte -->
        <div class="absolute top-1/2 left-1/2 -translate-x-[70%] -translate-y-[60%] w-80 h-80 rounded-full bg-blue-500/30 blur-3xl pointer-events-none animate-float"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-[20%] -translate-y-[20%] w-72 h-72 rounded-full bg-cyan-400/30 blur-3xl pointer-events-none animate-float" style="animation-delay: -3.5s;"></div>

        <div class="liquid-glass relative p-8 md:p-11 max-w-md w-full animate-fade-in" data-glass="static" data-reveal="zoom">
            
            <div class="text-center mb-8">
                <div class="icon-tile mx-auto mb-5 animate-float">
                    🔐
                </div>
                <h1 id="auth-title" class="text-3xl md:text-4xl font-extrabold tracking-tight">Willkommen zurück</h1>
                <p id="auth-subtitle" class="text-[15px] mt-2 leading-relaxed font-medium">Melde dich an, um Artikel zu favorisieren.</p>
            </div>

            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">E-Mail-Adresse</label>
                    <input type="email" id="email" placeholder="deine@email.de" required class="glass-input font-medium text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Passwort</label>
                    <input type="password" id="password" placeholder="••••••••" required class="glass-input font-medium text-sm">
                </div>

                <div class="text-right">
                    <button type="button" id="btn-forgot" class="text-xs font-bold text-blue-600 hover:text-blue-700 cursor-pointer bg-transparent border-0">
                        Passwort vergessen?
                    </button>
                </div>

                <div id="error-msg" class="text-red-700 text-xs font-semibold bg-red-50/90 p-3.5 rounded-xl border border-red-200 hidden"></div>
                <div id="success-msg" class="text-emerald-800 text-xs font-semibold bg-emerald-50/90 p-3.5 rounded-xl border border-emerald-200 hidden"></div>

                <button type="submit" id="submit-btn" class="btn-brand w-full py-3.5 px-4 text-sm tracking-wide mt-3 cursor-pointer">
                    Einloggen
                </button>
            </form>

            <div id="social-divider" class="relative flex py-3 items-center my-2">
                <div class="flex-grow h-px bg-gradient-to-r from-transparent via-slate-300 to-transparent"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-xs font-bold uppercase tracking-wider">oder</span>
                <div class="flex-grow h-px bg-gradient-to-r from-transparent via-slate-300 to-transparent"></div>
            </div>

            <div id="google-auth-container">
                <button type="button" id="btn-google" class="btn-glass w-full gap-3 !text-slate-700 py-3.5 px-4 text-sm cursor-pointer">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Mit Google anmelden
                </button>
            </div>

            <div class="text-center mt-8 pt-5 border-t border-slate-900/10">
                <button type="button" id="toggle-link" class="text-xs font-bold text-blue-600 hover:text-blue-700 cursor-pointer transition-all bg-transparent border-0">
                    Noch kein Konto? Jetzt registrieren
                </button>
            </div>

        </div>
    </main>

    {% include footer.html %}

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendEmailVerification, 
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBccpK7f0yed4wCOvvDrzZaSIRuIz7DaIE",
            authDomain: "m-fleger-web.firebaseapp.com",
            projectId: "m-fleger-web",
            storageBucket: "m-fleger-web.firebasestorage.app",
            messagingSenderId: "714771931411",
            appId: "1:714771931411:web:b9ffa44c25e3af0e2c3ae6",
            measurementId: "G-2CXLWPY5L9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let isSignUpMode = false;

        const form = document.getElementById('auth-form');
        const toggleBtn = document.getElementById('toggle-link');
        const forgotBtn = document.getElementById('btn-forgot');
        const googleBtn = document.getElementById('btn-google');
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');

        toggleBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btn = document.getElementById('submit-btn');
            
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            
            if (isSignUpMode) {
                title.innerText = "Konto erstellen";
                subtitle.innerText = "Gib eine E-Mail und ein Passwort ein, um dich zu registrieren.";
                btn.innerText = "Registrieren";
                toggleBtn.innerText = "Bereits ein Konto? Hier anmelden";
            } else {
                title.innerText = "Willkommen zurück";
                subtitle.innerText = "Melde dich an, um Artikel zu favorisieren.";
                btn.innerText = "Einloggen";
                toggleBtn.innerText = "Noch kein Konto? Jetzt registrieren";
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email || !password) {
                errorMsg.innerText = "Bitte fülle alle Felder aus.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                if (isSignUpMode) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(userCredential.user);
                    await signOut(auth);
                    
                    successMsg.innerText = "Registrierung erfolgreich! Bitte bestätige deine E-Mail-Adresse über den Link in deiner Postbox.";
                    successMsg.classList.remove('hidden');
                    toggleBtn.click();
                } else {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    
                    if (!userCredential.user.emailVerified) {
                        await signOut(auth);
                        errorMsg.innerText = "Bitte bestätige zuerst deine E-Mail-Adresse über den zugesandten Link.";
                        errorMsg.classList.remove('hidden');
                        return;
                    }

                    window.location.href = "/profil.html";
                }
            } catch (error) {
                errorMsg.innerText = "Fehler: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        });

        forgotBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value.trim();
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email) {
                errorMsg.innerText = "Bitte gib deine E-Mail-Adresse ein, um das Passwort zurückzusetzen.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                successMsg.innerText = "E-Mail zum Zurücksetzen wurde gesendet!";
                successMsg.classList.remove('hidden');
            } catch (error) {
                errorMsg.innerText = "Fehler beim Zurücksetzen: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        });

        googleBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "/profil.html";
            } catch (error) {
                errorMsg.innerText = "Google-Login fehlgeschlagen: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
