---
layout: null
title: Login
---
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Fleger | Login</title>
    
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/jpeg" href="/auge-logo.jpg">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s ease-out forwards; }
        .liquid-glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-100 min-h-screen text-gray-900 font-sans antialiased flex flex-col justify-between relative">

    {% include navigation.html %}

    <main class="flex-grow flex items-center justify-center px-4 py-12 md:py-20">
        <div class="liquid-glass p-8 md:p-10 rounded-3xl shadow-xl max-w-md w-full animate-fade-in">
            
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 font-black text-2xl mb-4 shadow-xs">
                    🔐
                </div>
                <h1 id="auth-title" class="text-3xl font-black text-slate-900 tracking-tight">Willkommen zurück</h1>
                <p id="auth-subtitle" class="text-slate-600 text-sm mt-2 leading-relaxed font-medium">Melde dich an, um Artikel zu favorisieren.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">E-Mail-Adresse</label>
                    <input type="email" id="email" placeholder="deine@email.de" class="w-full bg-white/60 border border-slate-200/80 p-3.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:bg-white font-medium text-sm transition-all">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Passwort</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-white/60 border border-slate-200/80 p-3.5 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:bg-white font-medium text-sm transition-all">
                </div>

                <div class="text-right">
                    <button type="button" onclick="handleForgotPassword()" class="text-xs font-bold text-blue-600 hover:text-blue-700 cursor-pointer bg-transparent border-0">
                        Passwort vergessen?
                    </button>
                </div>

                <div id="error-msg" class="text-red-700 text-xs font-semibold bg-red-50/90 p-3.5 rounded-xl border border-red-200 hidden"></div>
                <div id="success-msg" class="text-emerald-800 text-xs font-semibold bg-emerald-50/90 p-3.5 rounded-xl border border-emerald-200 hidden"></div>

                <button onclick="handleAuth()" id="submit-btn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition-all cursor-pointer text-sm tracking-wide mt-2 border-0">
                    Einloggen
                </button>

                <div id="social-divider" class="relative flex py-3 items-center">
                    <div class="flex-grow border-t border-slate-200"></div>
                    <span class="flex-shrink mx-4 text-slate-400 text-xs font-bold uppercase tracking-wider">oder</span>
                    <div class="flex-grow border-t border-slate-200"></div>
                </div>

                <div id="google-auth-container">
                    <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200/80 text-slate-700 font-bold py-3.5 px-4 rounded-xl shadow-xs hover:bg-slate-50 transition-all cursor-pointer text-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Mit Google anmelden
                    </button>
                </div>
            </div>

            <div class="text-center mt-8 pt-4 border-t border-slate-200/60">
                <button onclick="toggleAuthMode()" id="toggle-link" class="text-xs font-bold text-blue-600 hover:text-blue-700 cursor-pointer transition-all bg-transparent border-0">
                    Noch kein Konto? Jetzt registrieren
                </button>
            </div>

        </div>
    </main>

    {% include footer.html %}

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            sendEmailVerification, 
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBccpK7f0yed4wCOvvDrzZaSIRuIz7DaIE",
            authDomain: "m-fleger-web.firebaseapp.com",
            projectId: "m-fleger-web",
            storageBucket: "m-fleger-web.firebasestorage.app",
            messagingSenderId: "714771931411",
            appId: "1:714771931411:web:b9ffa44c25e3af0e2c3ae6",
            measurementId: "G-2CXLWPY5L9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        let isSignUpMode = false;

        window.toggleAuthMode = function() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btn = document.getElementById('submit-btn');
            const link = document.getElementById('toggle-link');
            
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('success-msg').classList.add('hidden');
            
            if (isSignUpMode) {
                title.innerText = "Konto erstellen";
                subtitle.innerText = "Gib eine E-Mail und ein Passwort ein, um dich zu registrieren.";
                btn.innerText = "Registrieren";
                link.innerText = "Bereits ein Konto? Hier anmelden";
            } else {
                title.innerText = "Willkommen zurück";
                subtitle.innerText = "Melde dich an, um Artikel zu favorisieren.";
                btn.innerText = "Einloggen";
                link.innerText = "Noch kein Konto? Jetzt registrieren";
            }
        };

        window.handleAuth = async function() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email || !password) {
                errorMsg.innerText = "Bitte fülle alle Felder aus.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                if (isSignUpMode) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    await sendEmailVerification(userCredential.user);
                    await signOut(auth); // Direkt wieder ausloggen, bis bestätigt wurde
                    
                    successMsg.innerText = "Registrierung erfolgreich! Wir haben dir einen Bestätigungslink per E-Mail geschickt. Bitte bestätige deine Adresse vor dem Login.";
                    successMsg.classList.remove('hidden');
                    window.toggleAuthMode();
                } else {
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    
                    if (!userCredential.user.emailVerified) {
                        await signOut(auth);
                        errorMsg.innerText = "Bitte bestätige zuerst deine E-Mail-Adresse über den zugesandten Link.";
                        errorMsg.classList.remove('hidden');
                        return;
                    }

                    window.location.href = "/index.html";
                }
            } catch (error) {
                errorMsg.innerText = "Fehler: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        };

        window.handleForgotPassword = async function() {
            const email = document.getElementById('email').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email) {
                errorMsg.innerText = "Bitte gib deine E-Mail-Adresse in das Feld ein, um das Passwort zurückzusetzen.";
                errorMsg.classList.remove('hidden');
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                successMsg.innerText = "Eine E-Mail zum Zurücksetzen des Passworts wurde versendet!";
                successMsg.classList.remove('hidden');
            } catch (error) {
                errorMsg.innerText = "Fehler beim Zurücksetzen: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        };

        window.loginWithGoogle = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "/index.html";
            } catch (error) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.innerText = "Google-Login fehlgeschlagen: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
