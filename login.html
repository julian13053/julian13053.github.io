---
layout: null
title: Login
---
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Fleger | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex flex-col min-h-screen">

    <!-- MENÜ -->
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-xs">
        {% include navigation.html %}
    </nav>

    <!-- LOGIN FORMULAR BOX -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-gray-100 p-8 rounded-3xl shadow-xl max-w-md w-full">
            
            <div class="text-center mb-8">
                <h1 id="auth-title" class="text-3xl font-black text-gray-950 tracking-tight">Willkommen zurück</h1>
                <p id="auth-subtitle" class="text-gray-500 text-sm mt-2">Melde dich an, um Artikel zu favorisieren.</p>
            </div>

            <!-- E-Mail Formular -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">E-Mail-Adresse</label>
                    <input type="email" id="email" placeholder="deine@email.de" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:outline-hidden focus:border-blue-500 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Passwort</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:outline-hidden focus:border-blue-500 font-medium">
                </div>

                <div id="error-msg" class="text-red-600 text-xs font-semibold hidden"></div>
                <div id="success-msg" class="text-green-600 text-xs font-semibold hidden"></div>

                <button onclick="handleAuth()" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all cursor-pointer">
                    Einloggen
                </button>

                <!-- Trennlinie für Social Login -->
                <div id="social-divider" class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-gray-200"></div>
                    <span class="flex-shrink mx-4 text-gray-400 text-xs font-semibold uppercase tracking-wider">oder</span>
                    <div class="flex-grow border-t border-gray-200"></div>
                </div>

                <!-- Google Login Button -->
                <div id="google-auth-container">
                    <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-xs hover:bg-gray-50 transition-all cursor-pointer text-sm">
                        <svg class="w-5 h-5" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        Mit Google anmelden
                    </button>
                </div>
            </div>

            <!-- Switcher zwischen Login und Registrierung -->
            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" id="toggle-link" class="text-xs font-bold text-blue-600 hover:underline cursor-pointer">
                    Noch kein Konto? Jetzt registrieren
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    {% include footer.html %}

    <script>
        const LOGIN_SUPABASE_URL = "https://xxuanzhrrpwurkyjfjky.supabase.co";
        const LOGIN_SUPABASE_ANON_KEY = "sb_publishable_WdzN1r5HkdnqrfIN2phV1g_-GdLlknq";
        
        const supabaseClient = supabase.createClient(LOGIN_SUPABASE_URL, LOGIN_SUPABASE_ANON_KEY);
        
        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btn = document.getElementById('submit-btn');
            const link = document.getElementById('toggle-link');
            
            document.getElementById('error-msg').classList.add('hidden');
            document.getElementById('success-msg').classList.add('hidden');
            
            if (isSignUpMode) {
                title.innerText = "Konto erstellen";
                subtitle.innerText = "Gib eine E-Mail und ein Passwort ein, um dich zu registrieren.";
                btn.innerText = "Registrieren";
                link.innerText = "Bereits ein Konto? Hier anmelden";
            } else {
                title.innerText = "Willkommen zurück";
                subtitle.innerText = "Melde dich an, um Artikel zu favorisieren.";
                btn.innerText = "Einloggen";
                link.innerText = "Noch kein Konto? Jetzt registrieren";
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email || !password) {
                errorMsg.innerText = "Bitte fülle alle Felder aus.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (isSignUpMode) {
                // REGISTRIERUNG
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    successMsg.innerText = "Konto erfolgreich erstellt! Du kannst dich jetzt direkt einloggen.";
                    successMsg.classList.remove('hidden');
                    // Schalte Modus zurück auf Login
                    toggleAuthMode();
                }
            } else {
                // LOGIN
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    errorMsg.innerText = "Login fehlgeschlagen: " + error.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    window.location.href = "/index.html";
                }
            }
        }

        // GOOGLE OAUTH LOGIN FUNKTION
        async function loginWithGoogle() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            
            if (error) {
                const errorMsg = document.getElementById('error-msg');
                errorMsg.innerText = "Google-Login fehlgeschlagen: " + error.message;
                errorMsg.classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
