---
layout: null
title: Login
---
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Fleger | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex flex-col min-h-screen">

    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-xs">
        {% include navigation.html %}
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-gray-100 p-8 rounded-3xl shadow-xl max-w-md w-full">
            
            <div class="text-center mb-8">
                <h1 id="auth-title" class="text-3xl font-black text-gray-950 tracking-tight">Willkommen zurück</h1>
                <p id="auth-subtitle" class="text-gray-500 text-sm mt-2">Melde dich an, um Artikel zu favorisieren.</p>
            </div>

            <button onclick="loginWithGoogle()" class="w-full bg-white border border-gray-200 text-gray-700 font-bold py-3 px-4 rounded-xl shadow-xs hover:bg-gray-50 transition-all flex items-center justify-center gap-3 cursor-pointer mb-6">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5.04c1.64 0 3.12.56 4.28 1.67l3.2-3.2C17.52 1.58 14.96 1 12 1 7.35 1 3.4 3.65 1.5 7.5l3.6 2.8C6.01 7.22 8.76 5.04 12 5.04z"/>
                    <path fill="#4285F4" d="M23.49 12.27c0-.81-.07-1.59-.2-2.36H12v4.51h6.46c-.29 1.48-1.14 2.73-2.42 3.57v2.96h3.91c2.28-2.1 3.54-5.19 3.54-8.68z"/>
                    <path fill="#FBBC05" d="M5.1 14.7c-.25-.76-.39-1.57-.39-2.4s.14-1.64.39-2.4L1.5 7.1C.54 9.03 0 11.16 0 13.4s.54 4.37 1.5 6.3l3.6-2.8z"/>
                    <path fill="#34A853" d="M12 23c3.24 0 5.97-1.07 7.96-2.91l-3.91-2.96c-1.08.72-2.47 1.16-4.05 1.16-3.24 0-5.99-2.18-6.97-5.26l-3.6 2.8C3.4 20.35 7.35 23 12 23z"/>
                </svg>
                Mit Google anmelden
            </button>

            <div class="flex items-center my-4">
                <div class="flex-grow border-t border-gray-100"></div>
                <span class="px-3 text-xs text-gray-400 font-bold uppercase tracking-wider">oder</span>
                <div class="flex-grow border-t border-gray-100"></div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">E-Mail-Adresse</label>
                    <input type="email" id="email" placeholder="deine@email.de" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:outline-hidden focus:border-blue-500 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Passwort</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:outline-hidden focus:border-blue-500 font-medium">
                </div>

                <div id="error-msg" class="text-red-600 text-xs font-semibold hidden"></div>
                <div id="success-msg" class="text-green-600 text-xs font-semibold hidden"></div>

                <button onclick="handleAuth()" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all cursor-pointer">
                    Einloggen
                </button>
            </div>

            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" id="toggle-link" class="text-xs font-bold text-blue-600 hover:underline cursor-pointer">
                    Noch kein Konto? Jetzt registrieren
                </button>
            </div>

        </div>
    </main>

    {% include footer.html %}

    <script>
        // HIER EXAKT DIE GLEICHEN DATEN WIE IN DER NAVIGATION EINTRAGEN
        const LOGIN_SUPABASE_URL = "DEINE_SUPABASE_URL_HIER";
        const LOGIN_SUPABASE_ANON_KEY = "DEIN_SUPABASE_ANON_KEY_HIER";
        
        const supabaseClient = supabase.createClient(LOGIN_SUPABASE_URL, LOGIN_SUPABASE_ANON_KEY);
        
        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const title = document.getElementById('auth-title');
            const subtitle = document.getElementById('auth-subtitle');
            const btn = document.getElementById('submit-btn');
            const link = document.getElementById('toggle-link');
            
            if (isSignUpMode) {
                title.innerText = "Konto erstellen";
                subtitle.innerText = "Registriere dich, um exklusive Features zu nutzen.";
                btn.innerText = "Registrieren";
                link.innerText = "Bereits ein Konto? Hier anmelden";
            } else {
                title.innerText = "Willkommen zurück";
                subtitle.innerText = "Melde dich an, um Artikel zu favorisieren.";
                btn.innerText = "Einloggen";
                link.innerText = "Noch kein Konto? Jetzt registrieren";
            }
        }

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email || !password) {
                errorMsg.innerText = "Bitte fülle alle Felder aus.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (isSignUpMode) {
                // REGISTRIERUNG
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    successMsg.innerText = "Registrierung erfolgreich! Bitte prüfe deine E-Mails für den Bestätigungslink.";
                    successMsg.classList.remove('hidden');
                }
            } else {
                // LOGIN
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    errorMsg.innerText = "Login fehlgeschlagen: " + error.message;
                    errorMsg.classList.remove('hidden');
                } else {
                    window.location.href = "/index.html";
                }
            }
        }

        async function loginWithGoogle() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) {
                alert("Google-Login fehlgeschlagen: " + error.message);
            }
        }
    </script>

</body>
</html>
