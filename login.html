---
layout: null
title: Login
---
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Fleger | Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased flex flex-col min-h-screen">

    <!-- MENÜ -->
    <nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-xs">
        {% include navigation.html %}
    </nav>

    <!-- LOGIN FORMULAR BOX -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-gray-100 p-8 rounded-3xl shadow-xl max-w-md w-full">
            
            <div class="text-center mb-8">
                <h1 id="auth-title" class="text-3xl font-black text-gray-950 tracking-tight">Anmelden / Registrieren</h1>
                <p id="auth-subtitle" class="text-gray-500 text-sm mt-2">Gib deine E-Mail ein, um dich passwortlos einzuloggen oder ein Konto zu erstellen.</p>
            </div>

            <!-- E-Mail Formular -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">E-Mail-Adresse</label>
                    <input type="email" id="email" placeholder="deine@email.de" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl focus:outline-hidden focus:border-blue-500 font-medium">
                </div>

                <div id="error-msg" class="text-red-600 text-xs font-semibold hidden"></div>
                <div id="success-msg" class="text-green-600 text-xs font-semibold hidden"></div>

                <button onclick="loginWithMagicLink()" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer">
                    ✨ Login-Link per E-Mail senden
                </button>
            </div>

            <div class="text-center mt-6 border-t border-gray-100 pt-4 text-xs text-gray-400 font-medium">
                Sicher und passwortlos über Supabase geschützt.
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    {% include footer.html %}

    <script>
        // Deine echten Supabase Projektdaten
        const LOGIN_SUPABASE_URL = "https://xxuanzhrrpwurkyjfjky.supabase.co";
        const LOGIN_SUPABASE_ANON_KEY = "sb_publishable_WdzN1r5HkdnqrfIN2phV1g_-GdLlknq";
        
        const supabaseClient = supabase.createClient(LOGIN_SUPABASE_URL, LOGIN_SUPABASE_ANON_KEY);
        
        async function loginWithMagicLink() {
            const email = document.getElementById('email').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const btn = document.getElementById('submit-btn');

            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');

            if (!email) {
                errorMsg.innerText = "Bitte gib eine E-Mail-Adresse ein.";
                errorMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Wird gesendet...";

            const { data, error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    // Leitet den Nutzer nach dem Klick in der E-Mail zurück zu deiner Startseite
                    emailRedirectTo: window.location.origin + '/index.html',
                }
            });

            if (error) {
                errorMsg.innerText = "Fehler: " + error.message;
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "✨ Login-Link per E-Mail senden";
            } else {
                successMsg.innerText = "Post ist da! Wir haben dir einen magischen Login-Link geschickt. Klicke einfach darauf, um dich einzuloggen.";
                successMsg.classList.remove('hidden');
                btn.innerText = "E-Mail verschickt! 👍";
            }
        }
    </script>

</body>
</html>
