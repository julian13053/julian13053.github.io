---
layout: default
title: "Aktionstag-Kalender"
---

<style>
    .ak-seite-container {
        width: 100%;
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background-color: #f8fafc;
        box-sizing: border-box;
    }
    .ak-kalender-karte {
        background: #ffffff;
        max-width: 800px;
        width: 100%;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.04);
        padding: 25px;
        border: 1px solid #e2e8f0;
        box-sizing: border-box;
    }
    .ak-ueberschrift-zone {
        text-align: center;
        margin-bottom: 20px;
    }
    .ak-ueberschrift-zone h1 {
        font-size: 24px !important;
        color: #0f172a !important;
        font-weight: 800 !important;
        margin-bottom: 6px !important;
        background: transparent !important;
    }
    .ak-ueberschrift-zone p {
        color: #64748b !important;
        font-size: 14px !important;
        margin: 0 !important;
    }
    .ak-steuerung {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        padding: 10px;
        border-radius: 16px;
        margin-bottom: 20px;
        border: 1px solid #edf2f7;
    }
    .ak-btn {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 8px 14px;
        font-weight: bold;
        border-radius: 12px;
        cursor: pointer;
    }
    .ak-select, .ak-jahr-input {
        padding: 8px 12px;
        border: 1px solid #e2e8f0;
        background: #ffffff;
        border-radius: 12px;
        font-weight: bold;
        color: #334155;
    }
    .ak-jahr-input {
        width: 80px;
        text-align: center;
    }
    .ak-wochentage-grid {
        display: grid !important;
        grid-template-columns: repeat(7, 1fr) !important;
        width: 100% !important;
        margin-bottom: 10px !important;
        border-bottom: 2px solid #f1f5f9 !important;
        padding-bottom: 8px !important;
    }
    .ak-wochentag-name {
        text-align: center !important;
        font-weight: 700 !important;
        color: #94a3b8 !important;
        font-size: 12px !important;
    }
    .ak-wochen-zeilen-block {
        display: flex !important;
        flex-direction: column !important;
        gap: 6px !important;
        width: 100% !important;
    }
    .ak-woche-reihe {
        display: grid !important;
        grid-template-columns: repeat(7, 1fr) !important;
        width: 100% !important;
        gap: 6px !important;
    }
    .ak-tag-feld {
        aspect-ratio: 1 / 1 !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        background: #ffffff !important;
        border: 1px solid #f1f5f9 !important;
        border-radius: 12px !important;
        font-weight: 600 !important;
        font-size: 14px !important;
        color: #475569 !important;
    }
    .ak-tag-feld.empty {
        background: transparent !important;
        border: none !important;
    }
    .ak-tag-feld.action-day {
        background: #eff6ff !important;
        color: #2563eb !important;
        border: 2px solid #bfdbfe !important;
        cursor: pointer !important;
    }
    .ak-punkt {
        width: 5px;
        height: 5px;
        background: #2563eb;
        border-radius: 50%;
        margin-top: 2px;
    }
    .ak-heute-markierung {
        outline: 3px solid #2563eb !important;
    }
    .ak-popup-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(15, 23, 42, 0.3);
        align-items: center;
        justify-content: center;
        z-index: 9999;
        padding: 20px;
    }
    .ak-popup-overlay.active { display: flex !important; }
    .ak-popup-box {
        background: #ffffff;
        padding: 25px;
        border-radius: 20px;
        max-width: 400px;
        width: 100%;
        position: relative;
    }
</style>

<div class="ak-seite-container">
    <div class="ak-kalender-karte">
        <div class="ak-ueberschrift-zone">
            <h1>📅 Der Überflieger-Aktionstagskalender</h1>
            <p>Klicke auf einen blau markierten Tag, um die Bedeutung zu erfahren!</p>
        </div>

        <div class="ak-steuerung">
            <button id="prevMonth" class="ak-btn">◀</button>
            <select id="monthSelect" class="ak-select"></select>
            <input id="yearInput" type="number" class="ak-jahr-input">
            <button id="nextMonth" class="ak-btn">▶</button>
        </div>

        <div class="ak-wochentage-grid">
            <div class="ak-wochentag-name">Mo</div>
            <div class="ak-wochentag-name">Di</div>
            <div class="ak-wochentag-name">Mi</div>
            <div class="ak-wochentag-name">Do</div>
            <div class="ak-wochentag-name">Fr</div>
            <div class="ak-wochentag-name">Sa</div>
            <div class="ak-wochentag-name">So</div>
        </div>

        <div id="calendarGrid" class="ak-wochen-zeilen-block"></div>
    </div>
</div>

<div id="infoModal" class="ak-popup-overlay">
    <div class="ak-popup-box">
        <button id="closeModal" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; cursor: pointer; color: #94a3b8;">&times;</button>
        <div id="modalDate" style="display: inline-block; background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 10px;"></div>
        <h3 id="modalTitle" style="margin: 0 0 10px 0; color: #0f172a;"></h3>
        <p id="modalDescription" style="margin: 0; color: #475569; font-size: 14px; line-height: 1.5;"></p>
    </div>
</div>

<script>
const actionDays = {
    "03-21": { title: "Tag gegen Rassismus ✊", desc: "Erinnert an Gleichberechtigung und setzt weltweit Zeichen gegen Diskriminierung." },
    "05-03": { title: "Tag der Pressefreiheit 📰", desc: "Macht auf die Wichtigkeit freier Berichterstattung weltweit aufmerksam." },
    "06-01": { title: "Weltkindertag 👶", desc: "Stellt den Schutz und die Rechte von Kindern in den Fokus." },
    "06-09": { title: "Tag der Antidiskriminierung ✊", desc: "Ein Tag für Vielfalt und den gleichen Respekt für alle Menschen." },
    "06-11": { title: "Tag der Freiheit 🗽", desc: "Erinnert daran, wie wichtig Freiheit und Demokratie für uns alle sind." },
    "11-20": { title: "Tag der Kinderrechte 📜", desc: "Feiert den Beschluss der UN-Kinderrechtskonvention." },
    "12-10": { title: "Tag der Menschenrechte 🌍", desc: "Erinnert an die Erklärung der Menschenrechte von 1948." }
};

const monatsNamen = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const grid = document.getElementById('calendarGrid');
const monthSelect = document.getElementById('monthSelect');
const yearInput = document.getElementById('yearInput');
const modal = document.getElementById('infoModal');

if(monthSelect && monthSelect.options.length === 0) {
    monatsNamen.forEach((m, idx) => {
        let opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = m;
        monthSelect.appendChild(opt);
    });
}

let d = new Date();
let aktMonat = d.getMonth();
let aktJahr = d.getFullYear() < 2026 ? 2026 : d.getFullYear();

function baueKalender() {
    if(!grid || !monthSelect || !yearInput) return;
    grid.innerHTML = '';
    const m = parseInt(monthSelect.value);
    const y = parseInt(yearInput.value);
    
    let ersterTag = new Date(y, m, 1).getDay() - 1;
    if (ersterTag === -1) ersterTag = 6; 
    
    let tageImMonat = new Date(y, m + 1, 0).getDate();
    
    let alleZellen = [];
    for (let i = 0; i < ersterTag; i++) {
        alleZellen.push({ leer: true });
    }
    for (let tag = 1; tag <= tageImMonat; tag++) {
        alleZellen.push({ leer: false, nummer: tag });
    }
    
    while(alleZellen.length > 0) {
        let wochenZellen = alleZellen.splice(0, 7);
        let wochenReihe = document.createElement('div');
        wochenReihe.className = 'ak-woche-reihe';
        
        while(wochenZellen.length < 7) {
            wochenZellen.push({ leer: true });
        }
        
        wochenZellen.forEach(z => {
            let zelleHtml = document.createElement('div');
            if (z.leer) {
                zelleHtml.className = 'ak-tag-feld empty';
            } else {
                zelleHtml.className = 'ak-tag-feld';
                zelleHtml.innerText = z.nummer;
                
                let mKey = String(m + 1).padStart(2, '0');
                let dKey = String(z.nummer).padStart(2, '0');
                let schluessel = `${mKey}-${dKey}`;
                
                if (actionDays[schluessel]) {
                    zelleHtml.classList.add('action-day');
                    let punkt = document.createElement('div');
                    punkt.className = 'ak-punkt';
                    zelleHtml.appendChild(punkt);
                    zelleHtml.onclick = () => zeigeDetails(z.nummer, m + 1, y, actionDays[schluessel]);
                }
                
                let heute = new Date();
                // HIER WAR DER FEHLER BEHOBEN: heute statt today
                if (z.nummer === heute.getDate() && m === heute.getMonth() && y === heute.getFullYear()) {
                    zelleHtml.classList.add('ak-heute-markierung');
                }
            }
            wochenReihe.appendChild(zelleHtml);
        });
        grid.appendChild(wochenReihe);
    }
}

function zeigeDetails(tag, monat, jahr, daten) {
    document.getElementById('modalDate').innerText = `${String(tag).padStart(2, '0')}.${String(monat).padStart(2, '0')}.${jahr}`;
    document.getElementById('modalTitle').innerText = daten.title;
    document.getElementById('modalDescription').innerText = daten.desc;
    modal.classList.add('active');
}

if(document.getElementById('closeModal')) {
    document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
}
window.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

monthSelect.onchange = baueKalender;
yearInput.oninput = baueKalender;

document.getElementById('prevMonth').onclick = () => {
    let val = parseInt(monthSelect.value) - 1;
    if (val < 0) { val = 11; yearInput.value = parseInt(yearInput.value) - 1; }
    monthSelect.value = val;
    baueKalender();
};
document.getElementById('nextMonth').onclick = () => {
    let val = parseInt(monthSelect.value) + 1;
    if (val > 11) { val = 0; yearInput.value = parseInt(yearInput.value) + 1; }
    monthSelect.value = val;
    baueKalender();
};

monthSelect.value = aktMonat;
yearInput.value = aktJahr;
baueKalender();
</script>
