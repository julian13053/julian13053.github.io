backend:
  name: github
  repo: DEIN_GITHUB_USERNAME/DEIN_REPOSITORY_NAME # Pass das hier an (z.B. julian/m-fleger-web)
  branch: main # Oder master, je nachdem wie dein GitHub-Branch heißt

media_folder: "assets/uploads" # Hier landen hochgeladene Bilder
public_folder: "/assets/uploads"

collections:
  - name: "blog"
    label: "Blog-Beiträge"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Vorschautext", name: "excerpt", widget: "string" }
      - { label: "Kategorien", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Inhalt", name: "body", widget: "markdown" }
