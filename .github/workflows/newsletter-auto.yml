name: Send Newsletter on New Post

on:
  push:
    paths:
      - '_posts/**' # Reagiert nur, wenn im Ordner _posts etwas Neues hochgeladen wird

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js resend gray-matter

      - name: Run Newsletter Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node -e "
          const { createClient } = require('@supabase/supabase-js');
          const { Resend } = require('resend');
          const fs = require('fs');
          const path = require('path');
          const matter = require('gray-matter');

          const supabase = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
          const resend = new Resend(process.env.RESEND_API_KEY);

          async function run() {
            const postsDir = path.join(process.cwd(), '_posts');
            if (!fs.existsSync(postsDir)) {
              console.log('Kein _posts Ordner gefunden.');
              return;
            }
            const files = fs.readdirSync(postsDir).filter(f => f.endsWith('.md') || f.endsWith('.html'));
            if (files.length === 0) return;
            
            files.sort();
            const latestFile = files[files.length - 1];
            const filePath = path.join(postsDir, latestFile);
            
            const fileContent = fs.readFileSync(filePath, 'utf8');
            const { data } = matter(fileContent);
            
            const title = data.title || 'Neuer Artikel auf M-Fleger';
            
            const { data: subscribers, error } = await supabase
              .from('newsletter_subscribers')
              .select('email');
              
            if (error || !subscribers || subscribers.length === 0) {
              console.log('Keine Abonnenten gefunden oder Fehler:', error);
              return;
            }

            const emailList = subscribers.map(s => s.email);
            console.log('Sende an ' + emailList.length + ' Abonnenten...');

            try {
              await resend.emails.send({
                from: 'Julian Fleger | M-Fleger.de <onboarding@resend.dev>',
                to: 'julian@m-fleger.de',
                bcc: emailList,
                subject: '🔥 Neuer Artikel: ' + title,
                html: '<h2>Hallo!</h2><p>Es gibt einen brandneuen Artikel auf unserer Plattform:</p><h3>' + title + '</h3><p>Lies jetzt den vollständigen Beitrag direkt auf der Website!</p><br><a href=\"https://m-fleger.de/blog.html\" style=\"background:#2563eb;color:white;padding:10px 20px;text-decoration:none;border-radius:8px;font-weight:bold;\">Zum Artikel springen</a>'
              });
              console.log('Newsletter erfolgreich verschickt!');
            } catch (mailError) {
              console.error('Fehler beim E-Mail-Versand:', mailError);
            }
          }
          run();
          "
