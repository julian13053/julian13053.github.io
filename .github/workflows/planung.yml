name: Geplante Artikel veröffentlichen

on:
  schedule:
    # Dieser Befehl (Cron) sagt: "Jeden Tag um 13:05 Uhr UTC"
    # Das entspricht 15:05 Uhr deutscher Sommerzeit.
    - cron: '5 13 * * *'
  # Erlaubt es dir, den Prozess auch manuell zu starten
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages build
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ github.repository }}/pages/builds
