<!-- Firebase Auth Status für Navigation -->
<script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const auth = getAuth();
    const navBtn = document.getElementById("nav-auth-btn");
    const mobileBtn = document.getElementById("mobile-auth-btn");

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Nutzer eingeloggt -> Zeige Profil
            if (navBtn) {
                navBtn.textContent = "Profil";
                navBtn.href = "/profil.html";
            }
            if (mobileBtn) {
                mobileBtn.textContent = "Profil";
                mobileBtn.href = "/profil.html";
            }
        } else {
            // Nutzer nicht eingeloggt -> Zeige Login
            if (navBtn) {
                navBtn.textContent = "Login";
                navBtn.href = "/login.html";
            }
            if (mobileBtn) {
                mobileBtn.textContent = "Login";
                mobileBtn.href = "/login.html";
            }
        }
    });
</script>
