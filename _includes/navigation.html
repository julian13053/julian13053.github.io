<script>
    const SUPABASE_URL_NAV = "https://xxuanzhrrpwurkyjfjky.supabase.co";
    const SUPABASE_ANON_KEY_NAV = "sb_publishable_WdzN1r5HkdnqrfIN2phV1g_-GdLlknq";

    const supabaseClientNav = supabase.createClient(SUPABASE_URL_NAV, SUPABASE_ANON_KEY_NAV);

    // Desktop Dropdown Steuerung
    function toggleDropdown(event) {
        event.stopPropagation();
        const menu = document.getElementById('dropdown-menu');
        menu.classList.toggle('opacity-0');
        menu.classList.toggle('pointer-events-none');
    }

    // NEU: Handymenü auf- und zuklappen
    function toggleMobileMenu() {
        const mobileMenu = document.getElementById('mobile-menu');
        const icon = document.getElementById('menu-icon');
        mobileMenu.classList.toggle('hidden');
        
        // Icon wechseln (Burger-Striche zu "X" bei geöffnetem Zustand)
        if (mobileMenu.classList.contains('hidden')) {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"></path>';
        } else {
            icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>';
        }
    }

    // Schließen, wenn man außerhalb klickt
    document.addEventListener('click', function(e) {
        const dMenu = document.getElementById('dropdown-menu');
        if (dMenu && !dMenu.classList.contains('opacity-0') && !e.target.closest('#rights-dropdown')) {
            dMenu.classList.add('opacity-0');
            dMenu.classList.add('pointer-events-none');
        }
    });

    async function checkUser() {
        const { data: { user } } = await supabaseClientNav.auth.getUser();
        const authSection = document.getElementById('auth-nav-section');

        if (user && authSection) {
            authSection.innerHTML = `
                <div class="flex items-center gap-2 md:gap-3 text-xs md:text-sm">
                    <a href="/profil.html" class="text-gray-700 hover:text-blue-600 font-bold transition-all no-underline flex items-center gap-1 shrink-0">
                        <span>👤</span> 
                        <span class="max-w-[100px] md:max-w-[160px] truncate">${user.email}</span>
                    </a>
                    <button onclick="logoutNav()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-2 py-1.5 rounded-xl transition-all cursor-pointer border-0 text-xs shrink-0">
                        Abmelden
                    </button>
                </div>
            `;
        }
    }

    async function logoutNav() {
        await supabaseClientNav.auth.signOut();
        window.location.reload();
    }

    document.addEventListener("DOMContentLoaded", checkUser);
</script>
