            <img src="/auge-logo.jpg" alt="M-Fleger Logo" class="h-12 w-12 object-cover rounded-full shadow-md border border-white/40 transition-transform group-hover:scale-110">
            <span class="text-white">M-Fleger</span>
        </a>
    </div>

    <div class="hidden md:flex items-center space-x-8">
        <a href="/" class="text-sm font-semibold text-gray-200 hover:text-cyan-300 no-underline transition-colors">Startseite</a>
        <a href="/ueber-mich.html" class="text-sm font-semibold text-gray-200 hover:text-cyan-300 no-underline transition-colors">Über mich</a>
        <a href="/unsere-rechte.html" class="text-sm font-semibold text-gray-200 hover:text-cyan-300 no-underline transition-colors">Rechte-Hub</a>
        <a href="/spenden.html" class="text-sm font-semibold text-gray-200 hover:text-cyan-300 no-underline transition-colors">Spenden</a>
        <a href="/blog.html" class="text-sm font-semibold text-gray-200 hover:text-cyan-300 no-underline transition-colors">Blog</a>
        <a href="/kontakt.html" class="text-sm font-semibold text-gray-200 hover:text-cyan-300 no-underline transition-colors">Kontakt</a>
        <a href="/login.html" class="text-sm font-bold text-blue-950 bg-cyan-400 px-5 py-2.5 rounded-xl hover:bg-cyan-300 no-underline shadow-sm transition-all transform hover:-translate-y-0.5">Login</a>
    </div>

    <div class="flex md:hidden">
        <button id="mobile-menu-trigger" type="button" class="inline-flex items-center justify-center p-2 rounded-xl text-gray-200 hover:text-cyan-300 focus:outline-none transition-all cursor-pointer">
            <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
    </div>
</div>

<div id="mobile-menu-container" class="md:hidden opacity-0 translate-y-[-10px] pointer-events-none fixed inset-x-4 top-24 z-50 transition-all duration-300 ease-out">
    <div class="p-6 space-y-2 shadow-2xl border border-white/20 bg-slate-900/95 backdrop-blur-xl rounded-2xl">
        <a href="/" class="block px-3 py-2.5 rounded-xl text-base font-semibold text-white hover:bg-white/10 no-underline transition-all">Startseite</a>
        <a href="/ueber-mich.html" class="block px-3 py-2.5 rounded-xl text-base font-semibold text-white hover:bg-white/10 no-underline transition-all">Über mich</a>
        <a href="/unsere-rechte.html" class="block px-3 py-2.5 rounded-xl text-base font-semibold text-white hover:bg-white/10 no-underline transition-all">Rechte-Hub</a>
        <a href="/spenden.html" class="block px-3 py-2.5 rounded-xl text-base font-semibold text-white hover:bg-white/10 no-underline transition-all">Spenden</a>
        <a href="/blog.html" class="block px-3 py-2.5 rounded-xl text-base font-semibold text-white hover:bg-white/10 no-underline transition-all">Blog</a>
        <div class="border-t border-white/10 my-2"></div>
        <a href="/kontakt.html" class="block px-3 py-2 rounded-xl text-sm font-medium text-gray-300 hover:bg-white/10 no-underline transition-all">✉️ Kontakt</a>
        <a href="/login.html" class="block w-full text-center mt-3 px-4 py-3 rounded-xl text-base font-bold text-blue-950 bg-cyan-400 hover:bg-cyan-300 no-underline shadow-md transition-all">👤 Einloggen</a>
    </div>
</div>

<script>
    (function() {
        const trigger = document.getElementById('mobile-menu-trigger');
        const menu = document.getElementById('mobile-menu-container');
        
        if (trigger && menu) {
            // Öffnen / Schließen über den Hamburger Button
            trigger.addEventListener('click', function(e) {
                e.stopPropagation();
                const istOffen = !menu.classList.contains('opacity-0');
                if (!istOffen) {
                    menu.classList.remove('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
                    menu.classList.add('opacity-100', 'translate-y-0');
                } else {
                    menu.classList.remove('opacity-100', 'translate-y-0');
                    menu.classList.add('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
                }
            });

            // Verhindert, dass Klicks innerhalb des Menüs das Menü sofort schließen
            menu.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            // Schließt das Menü, wenn irgendwo anders hin geklickt wird
            document.addEventListener('click', function() {
                menu.classList.remove('opacity-100', 'translate-y-0');
                menu.classList.add('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
            });
        }
    })();
</script>
