<!-- ==========================================================
     Schwebende Liquid-Glass Navigation
     Styles: /style.css → Abschnitt "5. NAVIGATION"
     ========================================================== -->
<div id="nav-shell" class="nav-shell w-full max-w-6xl mx-auto px-3 sm:px-4 sticky top-3 sm:top-5 z-50">
    <nav class="nav-bar glass-smoke text-white" aria-label="Hauptnavigation">
        <div class="nav-row px-4 sm:px-6 flex items-center justify-between gap-4">

            <!-- Logo & Branding -->
            <a href="/" class="flex items-center gap-3 no-underline group shrink-0" aria-label="M-Fleger – zur Startseite">
                <span class="relative">
                    <span class="absolute -inset-1 rounded-full bg-gradient-to-br from-cyan-400/60 to-blue-600/60 blur-md opacity-0 group-hover:opacity-100 transition-opacity duration-500"></span>
                    <img src="/auge-logo.jpg" alt="" class="relative h-10 w-10 object-cover rounded-full ring-1 ring-white/25 shadow-lg transition-transform duration-500 group-hover:scale-105">
                </span>
                <span class="text-lg sm:text-xl font-extrabold tracking-tight text-white" style="font-family: var(--font-display);">
                    M-Fleger
                </span>
            </a>

            <!-- Desktop Links -->
            <div class="nav-links hidden md:flex items-center gap-0.5">
                <a href="/" class="nav-link" data-nav>Startseite</a>
                <a href="/ueber-mich" class="nav-link" data-nav>Über mich</a>
                <a href="/unsere-rechte" class="nav-link" data-nav>Rechte-Hub</a>
                <a href="/spenden" class="nav-link" data-nav>Spenden</a>
                <a href="/blog" class="nav-link" data-nav>Blog</a>
                <a href="/kontakt" class="nav-link" data-nav>Kontakt</a>
            </div>

            <!-- Login / Profil Button Desktop -->
            <div class="hidden md:flex items-center shrink-0">
                <a id="nav-auth-btn" href="/login" class="btn-brand text-sm px-5 py-2.5">Login</a>
            </div>

            <!-- Mobile Burger-Button -->
            <button id="mobile-menu-btn" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="mobile-menu"
                    class="md:hidden grid place-items-center w-11 h-11 rounded-xl text-slate-100 bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true">
                    <path class="burger-line" d="M4 6h16"></path>
                    <path class="burger-line" d="M4 12h16"></path>
                    <path class="burger-line" d="M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- Mobile Ausklapp-Menü (klappt weich auf, siehe .mobile-panel) -->
        <div id="mobile-menu" class="mobile-panel md:hidden" data-open="false">
            <div>
                <div class="px-3 pb-4 pt-1">
                    <hr class="glass-hairline mb-3">
                    <a href="/" class="mobile-link" data-nav>Startseite <span aria-hidden="true" class="text-slate-400/70">→</span></a>
                    <a href="/ueber-mich" class="mobile-link" data-nav>Über mich <span aria-hidden="true" class="text-slate-400/70">→</span></a>
                    <a href="/unsere-rechte" class="mobile-link" data-nav>Rechte-Hub <span aria-hidden="true" class="text-slate-400/70">→</span></a>
                    <a href="/spenden" class="mobile-link" data-nav>Spenden <span aria-hidden="true" class="text-slate-400/70">→</span></a>
                    <a href="/blog" class="mobile-link" data-nav>Blog <span aria-hidden="true" class="text-slate-400/70">→</span></a>
                    <a href="/kontakt" class="mobile-link" data-nav>Kontakt <span aria-hidden="true" class="text-slate-400/70">→</span></a>
                    <div class="pt-3 px-1">
                        <a id="mobile-auth-btn" href="/login" class="btn-brand w-full text-sm px-5 py-3">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</div>

<script>
    (function () {
        // Mobiles Menü öffnen/schließen (mit ARIA-Status für Screenreader)
        var btn = document.getElementById('mobile-menu-btn');
        var menu = document.getElementById('mobile-menu');
        if (btn && menu) {
            btn.addEventListener('click', function () {
                var open = menu.getAttribute('data-open') !== 'true';
                menu.setAttribute('data-open', String(open));
                btn.setAttribute('aria-expanded', String(open));
                btn.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
            });
        }

        // Aktuelle Seite markieren ("/blog", "/blog.html" und "/blog/" gelten als gleich)
        function normalize(path) {
            path = path.replace(/index\.html$/, '').replace(/\.html$/, '').replace(/\/+$/, '');
            return path === '' ? '/' : path;
        }
        var here = normalize(window.location.pathname);
        document.querySelectorAll('[data-nav]').forEach(function (link) {
            var target = normalize(link.getAttribute('href'));
            var isBlogPost = target === '/blog' && /^\/\d{4}\/\d{2}\/\d{2}\//.test(window.location.pathname);
            if (target === here || isBlogPost) link.setAttribute('aria-current', 'page');
        });

        // Leiste wird beim Scrollen etwas kompakter und dunkler
        var shell = document.getElementById('nav-shell');
        if (shell) {
            var onScroll = function () { shell.classList.toggle('is-scrolled', window.scrollY > 12); };
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }
    })();
</script>

<!-- Firebase Auth Status für Navigation (unverändert) -->
<script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const auth = getAuth();
    const navBtn = document.getElementById("nav-auth-btn");
    const mobileBtn = document.getElementById("mobile-auth-btn");

    onAuthStateChanged(auth, (user) => {
        if (user) {
            // Nutzer eingeloggt -> Zeige Profil
            if (navBtn) {
                navBtn.textContent = "Profil";
                navBtn.href = "/profil";
            }
            if (mobileBtn) {
                mobileBtn.textContent = "Profil";
                mobileBtn.href = "/profil";
            }
        } else {
            // Nutzer nicht eingeloggt -> Zeige Login
            if (navBtn) {
                navBtn.textContent = "Login";
                navBtn.href = "/login";
            }
            if (mobileBtn) {
                mobileBtn.textContent = "Login";
                mobileBtn.href = "/login";
            }
        }
    });
</script>
