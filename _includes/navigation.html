<script>
    const SUPABASE_URL_NAV = "https://xxuanzhrrpwurkyjfjky.supabase.co";
    const SUPABASE_ANON_KEY_NAV = "sb_publishable_WdzN1r5HkdnqrfIN2phV1g_-GdLlknq";

    const supabaseClientNav = supabase.createClient(SUPABASE_URL_NAV, SUPABASE_ANON_KEY_NAV);

    // Funktion für Klick-Steuerung auf Mobilgeräten
    function toggleDropdown(event) {
        event.stopPropagation();
        const menu = document.getElementById('dropdown-menu');
        menu.classList.toggle('opacity-0');
        menu.classList.toggle('pointer-events-none');
    }

    // Dropdown schießen, wenn man irgendwo anders hinklickt
    document.addEventListener('click', function() {
        const menu = document.getElementById('dropdown-menu');
        if (menu && !menu.classList.contains('opacity-0')) {
            menu.classList.add('opacity-0');
            menu.classList.add('pointer-events-none');
        }
    });

    async function checkUser() {
        const { data: { user } } = await supabaseClientNav.auth.getUser();
        const authSection = document.getElementById('auth-nav-section');

        if (user && authSection) {
            authSection.innerHTML = `
                <div class="flex items-center gap-3 text-sm">
                    <a href="/profil.html" class="text-gray-700 hover:text-blue-600 font-bold transition-all no-underline flex items-center gap-1">
                        👤 <span class="max-w-[150px] truncate">${user.email}</span>
                    </a>
                    <button onclick="logoutNav()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-1.5 rounded-xl transition-all cursor-pointer border-0">
                        Abmelden
                    </button>
                </div>
            `;
        }
    }

    async function logoutNav() {
        await supabaseClientNav.auth.signOut();
        window.location.reload();
    }

    document.addEventListener("DOMContentLoaded", checkUser);
</script>
