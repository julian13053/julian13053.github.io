<!-- Cookie-Banner Container -->
<div id="cookie-banner" class="cookie-banner-hidden">
    <div class="cookie-banner-content">
        <h3>🍪 Cookie-Einstellungen</h3>
        <p>Wir nutzen Cookies, um die Funktion unserer Website zu gewährleisten und unseren Datenverkehr zu analysieren. Bitte wählen Sie, welche Cookies Sie zulassen möchten.</p>
        <div class="cookie-banner-buttons">
            <button id="cookie-accept-all" class="cookie-btn cookie-btn-accept">Alle akzeptieren</button>
            <button id="cookie-accept-essential" class="cookie-btn cookie-btn-essential">Nur essenzielle</button>
            <button id="cookie-reject" class="cookie-btn cookie-btn-reject">Ablehnen</button>
        </div>
    </div>
</div>

<!-- Styling (CSS) -->
<style>
#cookie-banner {
    position: fixed;
    bottom: 20px;
    right: 20px;
    max-width: 400px;
    background-color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    border-radius: 8px;
    padding: 20px;
    font-family: sans-serif;
    z-index: 99999;
    box-sizing: border-box;
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.cookie-banner-hidden {
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
}

.cookie-banner-content h3 {
    margin-top: 0;
    color: #333;
    font-size: 1.2rem;
}

.cookie-banner-content p {
    font-size: 0.9rem;
    color: #666;
    line-height: 1.4;
    margin-bottom: 20px;
}

.cookie-banner-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.cookie-btn {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
}

.cookie-btn-accept {
    background-color: #2ecc71;
    color: white;
}

.cookie-btn-accept:hover { background-color: #27ae60; }

.cookie-btn-essential {
    background-color: #f1f2f6;
    color: #333;
}

.cookie-btn-essential:hover { background-color: #dfe4ea; }

.cookie-btn-reject {
    background-color: #ffffff;
    color: #e74c3c;
    border: 1px solid #e74c3c;
}

.cookie-btn-reject:hover {
    background-color: #e74c3c;
    color: white;
}

/* Anpassung für Mobilgeräte */
@media (max-width: 480px) {
    #cookie-banner {
        bottom: 0;
        right: 0;
        left: 0;
        max-width: 100%;
        border-radius: 12px 12px 0 0;
    }
}
</style>

<!-- Logik (JavaScript) -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const banner = document.getElementById("cookie-banner");
    const acceptAllBtn = document.getElementById("cookie-accept-all");
    const acceptEssentialBtn = document.getElementById("cookie-accept-essential");
    const rejectBtn = document.getElementById("cookie-reject");

    // Prüfen, ob der Nutzer bereits eine Wahl getroffen hat
    const cookieChoice = localStorage.getItem("cookieConsent");

    if (!cookieChoice) {
        // Banner anzeigen, wenn noch keine Entscheidung vorliegt
        banner.classList.remove("cookie-banner-hidden");
    }

    // Funktion zum Ausblenden und Speichern
    function setConsent(choice) {
        localStorage.setItem("cookieConsent", choice);
        banner.classList.add("cookie-banner-hidden");
        
        // Hier kannst du Skripte aktivieren je nach Wahl
        if (choice === 'all') {
            executeTrackingScripts();
        }
    }

    acceptAllBtn.addEventListener("click", () => setConsent("all"));
    acceptEssentialBtn.addEventListener("click", () => setConsent("essential"));
    rejectBtn.addEventListener("click", () => setConsent("rejected"));

    function executeTrackingScripts() {
        console.log("Tracking-Skripte (z.B. Google Analytics) geladen.");
        // Hier deinen Google Analytics oder Pixels Code einfügen
    }
});
</script>
