<div id="cookie-banner" class="hidden fixed bottom-4 right-4 left-4 md:left-auto md:max-w-md p-5 z-50 animate-fade-in flex flex-col gap-3 liquid-glass">
    <div class="flex items-start gap-3">
        <span class="text-2xl mt-0.5">🍪</span>
        <div>
            <h4 class="font-bold text-sm">Cookie-Hinweis</h4>
            <p class="text-xs mt-1 leading-relaxed">
                Diese Website nutzt lediglich technisch notwendige Funktionen, um dir ein sicheres und stabiles Surfen zu ermöglichen. Es werden keine Tracking-Cookies verwendet! 
                Weitere Infos findest du in unserer <a href="/datenschutz.html" class="text-blue-600 underline hover:text-blue-700 font-medium">Datenschutzerklärung</a>.
            </p>
        </div>
    </div>
    <div class="flex justify-end mt-1">
        <button id="accept-cookies" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition-colors cursor-pointer border-0 shadow-md">
            Alles klar!
        </button>
    </div>
</div>

<script>
    const GA_MEASUREMENT_ID = "G-XXXXXXXXXX"; // <--- DEINE ID REIN

    function loadGoogleAnalytics() {
        if (document.getElementById('ga-script')) return;
        const gaScript = document.createElement('script');
        gaScript.id = 'ga-script';
        gaScript.async = true;
        gaScript.src = `https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}`;
        document.head.appendChild(gaScript);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_MEASUREMENT_ID);
    }

    document.addEventListener("DOMContentLoaded", function() {
        // Wenn schon mal akzeptiert wurde -> GA direkt starten (Banner bleibt zu)
        if (localStorage.getItem("cookies-accepted")) {
            loadGoogleAnalytics();
        } else {
            // Wenn noch nicht akzeptiert -> Banner zeigen
            document.getElementById("cookie-banner").classList.remove("hidden");
        }

        // Klick auf den Button
        document.getElementById("accept-cookies").addEventListener("click", function() {
            localStorage.setItem("cookies-accepted", "true"); // Merken für die nächsten Seiten
            document.getElementById("cookie-banner").classList.add("hidden");
            loadGoogleAnalytics(); // Jetzt tracken
        });
    });
</script>
