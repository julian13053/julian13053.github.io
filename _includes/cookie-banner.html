<div id="cookie-banner" class="hidden fixed bottom-4 right-4 left-4 md:left-auto md:max-w-md bg-gray-950 text-white p-5 rounded-2xl shadow-2xl border border-gray-800 z-50 animate-fade-in flex flex-col gap-3">
    <div class="flex items-start gap-3">
        <span class="text-2xl mt-0.5">🍪</span>
        <div>
            <h4 class="font-bold text-sm text-gray-100">Cookie-Hinweis</h4>
            <p class="text-xs text-gray-400 mt-1 leading-relaxed">
                Diese Website nutzt lediglich technisch notwendige Funktionen, um dir ein sicheres und stabiles Surfen zu ermöglichen. Es werden keine Tracking-Cookies verwendet!
            </p>
        </div>
    </div>
    <div class="flex justify-end mt-1">
        <button id="accept-cookies" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-lg transition-colors cursor-pointer">
            Alles klar!
        </button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (!localStorage.getItem("cookies-accepted")) {
            document.getElementById("cookie-banner").classList.remove("hidden");
        }
        document.getElementById("accept-cookies").addEventListener("click", function() {
            localStorage.setItem("cookies-accepted", "true");
            document.getElementById("cookie-banner").classList.add("hidden");
        });
    });
</script>
