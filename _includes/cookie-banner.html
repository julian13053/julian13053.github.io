<div id="cookie-banner" class="hidden fixed bottom-4 right-4 left-4 md:left-auto md:max-w-md p-5 z-50 animate-fade-in flex flex-col gap-3" 
     style="
        background: rgba(255, 255, 255, 0.45) !important;
        backdrop-filter: blur(20px) saturate(125%) !important;
        -webkit-backdrop-filter: blur(20px) saturate(125%) !important;
        border: 1px solid rgba(255, 255, 255, 0.6) !important;
        box-shadow: 0 20px 50px rgba(31, 38, 135, 0.08) !important;
        border-radius: 24px;
     ">
    <div class="flex items-start gap-3">
        <span class="text-2xl mt-0.5">🍪</span>
        <div>
            <h4 class="font-bold text-sm" style="color: #1e3a8a;">Cookie-Hinweis</h4>
            <p class="text-xs mt-1 leading-relaxed" style="color: #334155;">
                Diese Website nutzt lediglich technisch notwendige Funktionen, um dir ein sicheres und stabiles Surfen zu ermöglichen. Es werden keine Tracking-Cookies verwendet!
            </p>
        </div>
    </div>
    <div class="flex justify-end mt-1">
        <button id="accept-cookies" class="text-white font-bold text-xs px-4 py-2 cursor-pointer"
                style="
                    background: #2563eb;
                    border: none;
                    border-radius: 12px;
                    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
                    transition: all 0.2s ease;
                "
                onmouseover="this.style.background='#1d4ed8'; this.style.transform='clientY(-1px)';"
                onmouseout="this.style.background='#2563eb'; this.style.transform='none';">
            Alles klar!
        </button>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        if (!localStorage.getItem("cookies-accepted")) {
            document.getElementById("cookie-banner").classList.remove("hidden");
        }
        document.getElementById("accept-cookies").addEventListener("click", function() {
            localStorage.setItem("cookies-accepted", "true");
            document.getElementById("cookie-banner").classList.add("hidden");
        });
    });
</script>
